[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arca-attention-audit"
version = "1.0.0"
description = "ARCA: ground-truth-anchored audit of tabular attention models (IJIES paper)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Harpreet Singh"}, {name = "Baldeep Singh"}]
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11",
                "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
full = ["torch", "pytorch-tabnet", "xgboost", "lightgbm", "interpret", "shap", "optuna", "pyyaml"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
